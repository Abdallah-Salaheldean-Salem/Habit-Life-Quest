<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15152a" />
    <meta name="description" content="Your habits are quests. A local-first RPG habit tracker." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Habit Quest" />
    <title>Habit Quest</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // updateViaCache:'none' keeps the browser from serving a stale sw.js
          // from its HTTP cache, so a new worker is detected on every visit.
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then((reg) => {
            reg.update();
            // When a new worker takes over, reload once so the fresh assets show.
            let reloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (reloaded) return;
              reloaded = true;
              window.location.reload();
            });
          });
        });
      }
    </script>
  </body>
</html>
